name: Release

# Push a tag like v0.1.0 → a DRAFT GitHub Release with a universal zip + SHA-256, signed with the Havus
# release certificate, and the debug symbols that make crash reports readable (Havus.app.dSYM.zip).
# Nothing is published until a maintainer reviews the draft.
#
# The certificate lives in the "release" environment (secrets HAVUS_SIGNING_P12_BASE64 and
# HAVUS_SIGNING_P12_PASSWORD), which only tags matching v*.*.* may use. See docs/maintainer.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    name: Build & draft release
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # needed only to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without the certificate the app would be ad-hoc signed, and every user would lose Full Disk Access.
      - name: Import the release certificate
        env:
          HAVUS_SIGNING_P12_BASE64: ${{ secrets.HAVUS_SIGNING_P12_BASE64 }}
          HAVUS_SIGNING_P12_PASSWORD: ${{ secrets.HAVUS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$HAVUS_SIGNING_P12_BASE64" ] || [ -z "$HAVUS_SIGNING_P12_PASSWORD" ]; then
            echo "::error::The release environment has no signing certificate, so this release stops here. See docs/maintainer.md."
            exit 1
          fi
          ./scripts/import-signing-certificate.sh "$RUNNER_TEMP/release-signing.keychain-db"
          echo "HAVUS_SIGNING_KEYCHAIN=$RUNNER_TEMP/release-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Build zip (universal, signed with the release certificate)
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/Havus-*.zip \
            build/release/Havus-*.zip.sha256 \
            build/release/Havus.app.dSYM.zip \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --generate-notes \
            --title "Havus ${GITHUB_REF_NAME#v}"
